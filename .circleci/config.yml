version: 2.1
executors:
  python-executor:
    docker:
      - image: cimg/python:3.9
    working_directory: ~/project
jobs:
  install-dependencies:
    executor: python-executor
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
workflows:
  version: 2
  install:
    jobs:
      - install-dependencies